name: Pilot feedback
description: Tell us about one useful or frustrating moment.
title: "[Pilot feedback] "
body:
  - type: markdown
    attributes:
      value: "One concrete experience is enough. This issue is public: omit private logs, project data and credentials."
  - type: textarea
    id: tried
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what did you expect?
      description: Tell us what helped, confused you or made you stop. A workaround is useful too.
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Agent, version or update ID (optional)
    validations:
      required: false
